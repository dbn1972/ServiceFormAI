##
# Integration Test CI/CD Pipeline
#
# Stages:
#  1. fast-integration    — runs on every PR (~60s)
#     - Frontend vitest: contract, schema, integration tests
#     - Backend Jest: unit tests (auth, health)
#     - TypeScript checks (both)
#     Blocks: merge if failing
#
#  2. full-integration    — runs on push to main/develop + nightly
#     - LocalStack (S3, SQS, SES) via services
#     - PostgreSQL + Redis via services
#     - Backend integration specs (all modules)
#     - Frontend full test suite
#     - DB migration dry-run
#     Blocks: release if failing
#
#  3. nightly-deep        — runs nightly at 02:00 UTC
#     - Full E2E suite (Playwright, all browsers)
#     - Full coverage reports
#
##

name: Integration Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Nightly deep suite at 02:00 UTC
    - cron: '0 2 * * *'

env:
  NODE_ENV: test
  JWT_SECRET: ci-test-jwt-secret-not-for-production
  JWT_REFRESH_SECRET: ci-test-refresh-secret-not-for-production
  # LocalStack / S3
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_DEFAULT_REGION: ap-south-1
  AWS_S3_ENDPOINT: http://localhost:4566
  AWS_S3_FORCE_PATH_STYLE: 'true'
  AWS_S3_BUCKET: serviceformai-documents

jobs:
  # ─── Stage 1: Fast integration (every PR) ──────────────────────────────────
  fast-integration:
    name: Fast Integration (PR Gate)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package.json

      - name: Install root dependencies
        run: npm ci

      - name: TypeScript check (frontend)
        run: npx tsc --noEmit

      - name: Frontend — API contract tests
        run: npx vitest run src/test/api-contracts/

      - name: Frontend — Schema tests
        run: npx vitest run src/test/schema/

      - name: Frontend — Integration tests (module contracts + auth security + consumer journey)
        run: npx vitest run src/test/integration/

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: TypeScript check (backend)
        working-directory: backend
        run: npx tsc --noEmit

      - name: Backend — unit tests
        working-directory: backend
        run: npx jest --testPathPattern="auth.service.spec|health.controller.spec" --runInBand
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-jwt-secret-not-for-production
          JWT_REFRESH_SECRET: ci-test-refresh-secret-not-for-production
          REDIS_URL: ''

  # ─── Stage 2: Full integration (main/develop push + nightly) ───────────────
  full-integration:
    name: Full Integration (Merge Gate)
    runs-on: ubuntu-latest
    needs: fast-integration

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: serviceformai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      localstack:
        image: localstack/localstack:3
        ports:
          - 4566:4566
        env:
          SERVICES: s3,sqs,ses,sns
          AWS_DEFAULT_REGION: ap-south-1
          PERSISTENCE: '0'
        options: >-
          --health-cmd "curl -f http://localhost:4566/_localstack/health"
          --health-interval 15s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s

    env:
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_USERNAME: testuser
      DB_PASSWORD: testpassword
      DB_NAME: serviceformai_test
      DB_SYNCHRONIZE: 'false'
      REDIS_URL: redis://localhost:6379
      # LocalStack / S3
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: ap-south-1
      AWS_S3_ENDPOINT: http://localhost:4566
      AWS_S3_FORCE_PATH_STYLE: 'true'
      AWS_S3_BUCKET: serviceformai-documents

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install all dependencies
        run: npm ci && cd backend && npm ci

      - name: Create S3 bucket in LocalStack
        run: |
          pip install awscli-local --quiet
          awslocal s3api create-bucket \
            --bucket serviceformai-documents \
            --create-bucket-configuration LocationConstraint=ap-south-1

      - name: Run DB migrations
        working-directory: backend
        run: npx ts-node -r tsconfig-paths/register node_modules/typeorm/cli.js migration:run -d src/database/data-source.ts

      - name: Frontend — full integration test suite
        run: npx vitest run src/test/

      - name: Backend — full integration test suite
        working-directory: backend
        run: npx jest --testPathPattern="integration.spec" --runInBand --forceExit
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-jwt-secret-not-for-production
          JWT_REFRESH_SECRET: ci-test-refresh-secret-not-for-production
          REDIS_URL: redis://localhost:6379

      - name: E2E smoke tests
        run: npx playwright install chromium && npx playwright test e2e/auth.spec.ts --project="Desktop Chrome"
        continue-on-error: true  # Non-blocking until backend is deployed in CI

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-artifacts
          path: |
            test-results/
            playwright-report/
            coverage/

  # ─── Stage 3: Nightly deep integration ─────────────────────────────────────
  nightly-deep:
    name: Nightly Deep Integration
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: serviceformai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      localstack:
        image: localstack/localstack:3
        ports:
          - 4566:4566
        env:
          SERVICES: s3,sqs,ses,sns
          AWS_DEFAULT_REGION: ap-south-1
          PERSISTENCE: '0'
        options: >-
          --health-cmd "curl -f http://localhost:4566/_localstack/health"
          --health-interval 15s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s

    env:
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_USERNAME: testuser
      DB_PASSWORD: testpassword
      DB_NAME: serviceformai_test
      DB_SYNCHRONIZE: 'false'
      REDIS_URL: redis://localhost:6379
      # LocalStack / S3
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: ap-south-1
      AWS_S3_ENDPOINT: http://localhost:4566
      AWS_S3_FORCE_PATH_STYLE: 'true'
      AWS_S3_BUCKET: serviceformai-documents

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install all dependencies
        run: npm ci && cd backend && npm ci

      - name: Create S3 buckets in LocalStack
        run: |
          pip install awscli-local --quiet
          awslocal s3api create-bucket \
            --bucket serviceformai-documents \
            --create-bucket-configuration LocationConstraint=ap-south-1
          awslocal s3api create-bucket \
            --bucket serviceformai-assets \
            --create-bucket-configuration LocationConstraint=ap-south-1

      - name: Run DB migrations
        working-directory: backend
        run: npx ts-node -r tsconfig-paths/register node_modules/typeorm/cli.js migration:run -d src/database/data-source.ts

      - name: Frontend — full coverage
        run: npx vitest run --coverage

      - name: Backend — full test suite with coverage
        working-directory: backend
        run: npx jest --coverage --runInBand --forceExit

      - name: E2E — full suite
        run: |
          npx playwright install
          npx playwright test
        continue-on-error: true

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-nightly
          path: |
            coverage/
            backend/coverage/
            playwright-report/
