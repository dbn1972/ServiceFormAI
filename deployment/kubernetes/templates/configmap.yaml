apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "serviceformai.fullname" . }}-config
  labels:
    {{- include "serviceformai.labels" . | nindent 4 }}
data:
  NODE_ENV: {{ .Values.app.nodeEnv | quote }}
  PORT: {{ .Values.app.port | quote }}
  DATABASE_HOST: {{ .Values.postgresql.host | quote }}
  DATABASE_PORT: {{ .Values.postgresql.port | quote }}
  DATABASE_NAME: {{ .Values.postgresql.database | quote }}
  REDIS_HOST: {{ .Values.redis.host | quote }}
  REDIS_PORT: {{ .Values.redis.port | quote }}
  S3_ENDPOINT: {{ .Values.minio.endpoint | quote }}
  S3_BUCKET: {{ .Values.minio.bucket | quote }}
  S3_REGION: {{ .Values.minio.region | quote }}
  APP_URL: {{ .Values.app.url | quote }}
  CORS_ALLOWED_ORIGINS: {{ .Values.app.url | quote }}
  LOG_LEVEL: {{ .Values.app.logLevel | quote }}
  ENABLE_METRICS: {{ .Values.app.enableMetrics | quote }}
  ENABLE_RATE_LIMITING: "true"
  ENABLE_CSRF_PROTECTION: "true"
  DPDP_ACT_2023_ENABLED: {{ .Values.compliance.dpdpEnabled | quote }}
  COOKIE_CONSENT_REQUIRED: {{ .Values.compliance.cookieConsentRequired | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "serviceformai.fullname" . }}-secrets
  labels:
    {{- include "serviceformai.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  JWT_REFRESH_SECRET: {{ .Values.secrets.jwtRefreshSecret | quote }}
  SESSION_SECRET: {{ .Values.secrets.sessionSecret | quote }}
  DATABASE_USER: {{ .Values.postgresql.username | quote }}
  DATABASE_PASSWORD: {{ .Values.postgresql.password | quote }}
  DATABASE_URL: {{ printf "postgresql://%s:%s@%s:%d/%s" .Values.postgresql.username .Values.postgresql.password .Values.postgresql.host (.Values.postgresql.port | int) .Values.postgresql.database | quote }}
  REDIS_PASSWORD: {{ .Values.redis.password | quote }}
  S3_ACCESS_KEY: {{ .Values.minio.accessKey | quote }}
  S3_SECRET_KEY: {{ .Values.minio.secretKey | quote }}
  SMTP_USER: {{ .Values.smtp.user | quote }}
  SMTP_PASS: {{ .Values.smtp.password | quote }}
