services:
  worker:
    image: serviceformai-cloudsphere-backend
    command: ["node", "dist/workers/main.js"]
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in the private server env file}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the private server env file}
      DB_NAME: ${DB_NAME:?Set DB_NAME in the private server env file}
      DB_SYNCHRONIZE: "false"
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in the private server env file}@redis:6379/0
      QUEUE_PROVIDER: database
      QUEUE_WRITE_PATH_ENABLED: "true"
      QUEUE_PAUSED: "false"
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped