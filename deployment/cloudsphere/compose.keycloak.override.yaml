services:
  keycloak:
    image: proctira-ops/keycloak-snapshot:20260928
    command:
      - start-dev
      - --http-enabled=true
      - --proxy-headers=xforwarded
    environment:
      KC_DB: postgres
      KC_DB_SCHEMA: serviceformai_keycloak
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: serviceformai
      KC_DB_URL_PORT: 5432
      KC_DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in the private server env file}
      KC_DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the private server env file}
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:?Set KEYCLOAK_PUBLIC_URL in the private server env file}
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: xforwarded
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USERNAME:?Set the dedicated Keycloak admin username}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set the dedicated Keycloak admin password}
    ports:
      - "127.0.0.1:8181:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  backend:
    environment:
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:?Set KEYCLOAK_ISSUER in the private server env file}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-serviceformai-api}

  frontend:
    build:
      args:
        VITE_KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:?Set KEYCLOAK_ISSUER in the private server env file}
        VITE_KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:?Set KEYCLOAK_CLIENT_ID in the private server env file}