services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in the CloudSphere env file}
      POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME in the CloudSphere env file}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the CloudSphere env file}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in the CloudSphere env file}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    image: serviceformai-cloudsphere-backend
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    command:
      - sh
      - -c
      - >-
        node node_modules/typeorm/cli.js migration:run -d dist/database/data-source.js &&
        exec node dist/main.js
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in the CloudSphere env file}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the CloudSphere env file}
      DB_NAME: ${DB_NAME:?Set DB_NAME in the CloudSphere env file}
      DB_SYNCHRONIZE: "false"
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in the CloudSphere env file}@redis:6379/0
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3100,http://127.0.0.1:3100}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the CloudSphere env file}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in the CloudSphere env file}
      OTP_PEPPER: ${OTP_PEPPER:?Set OTP_PEPPER in the CloudSphere env file}
      OTP_PROVIDER_URL: ${OTP_PROVIDER_URL:-}
      OTP_PROVIDER_API_KEY: ${OTP_PROVIDER_API_KEY:-}
      OTP_FIXED_TEST_ENABLED: ${OTP_FIXED_TEST_ENABLED:-false}
      OTP_FIXED_TEST_MOBILE: ${OTP_FIXED_TEST_MOBILE:-}
      OTP_FIXED_TEST_CODE: ${OTP_FIXED_TEST_CODE:-}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-serviceformai-api}
      AWS_S3_REGION: ${AWS_S3_REGION:-ap-south-1}
      AWS_S3_ENDPOINT: ${AWS_S3_ENDPOINT:-}
      AWS_S3_FORCE_PATH_STYLE: ${AWS_S3_FORCE_PATH_STYLE:-false}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-serviceformai-documents}
      QUEUE_PROVIDER: database
      CACHE_ENABLED: "true"
      TRUSTED_PROXY_CIDRS: 172.16.0.0/12
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "3001"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/api/v1/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s
    restart: unless-stopped
  worker:
    image: serviceformai-cloudsphere-backend
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    command: ["node", "dist/workers/main.js"]
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in the CloudSphere env file}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the CloudSphere env file}
      DB_NAME: ${DB_NAME:?Set DB_NAME in the CloudSphere env file}
      DB_SYNCHRONIZE: "false"
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in the CloudSphere env file}@redis:6379/0
      QUEUE_PROVIDER: database
      QUEUE_WRITE_PATH_ENABLED: "true"
      QUEUE_PAUSED: "false"
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ../..
      dockerfile: deployment/cloudsphere/frontend.Dockerfile
      args:
        VITE_API_URL: /api/v1
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_BIND_PORT:-3100}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
    name: serviceformai-cloudsphere-postgres
  redis_data:
    name: serviceformai-cloudsphere-redis
